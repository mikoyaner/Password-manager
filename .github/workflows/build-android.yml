name: build-android

on:
  workflow_dispatch: {}          # Actions 页面手动触发
  push:
    tags: ["v*"]                 # 推 v 开头标签时构建并发布 Release

permissions:
  contents: write                # 允许创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: 构建 Debug APK
        working-directory: 安卓
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: 整理产物名
        run: cp 安卓/app/build/outputs/apk/debug/app-debug.apk PwdMgr-debug.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PwdMgr-android-debug-apk
          path: PwdMgr-debug.apk
          if-no-files-found: error

      - name: 发布 Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-ghrelease@v2
        with:
          files: PwdMgr-debug.apk
