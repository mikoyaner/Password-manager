name: build-windows

on:
  workflow_dispatch: {}          # Actions 页面手动触发
  push:
    tags: ["v*"]                 # 推 v 开头标签时构建并发布 Release

permissions:
  contents: write                # 允许创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # 打包使用 PyQt5（PyQt6 6.11 的 DLL 在部分机器上无法加载，见 app.py 兼容层；
        # cryptography 钉在本地验证过的 44.0.1）
        run: pip install "PyQt5==5.15.10" argon2-cffi "cryptography==44.0.1" keyring "pyinstaller==6.21.0"

      - name: PyInstaller 打包
        working-directory: window
        run: pyinstaller "密码管理器.spec" --noconfirm

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PwdMgr-windows-exe
          path: window/dist/*.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-ghrelease@v2
        with:
          files: window/dist/*.exe
